services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops_guardian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops_guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg2://aiops:aiops@postgres:5432/aiops_guardian
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:80
      LLM_PROVIDER: auto
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHROMA_PERSIST_DIR: /data/chroma
      KNOWLEDGE_RUNBOOKS_DIR: /app/knowledge_base/runbooks
      KNOWLEDGE_UPLOADS_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data/chroma
      - uploads_data:/data/uploads
      - ./knowledge_base/runbooks:/app/knowledge_base/runbooks:ro
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  pgdata:
  chroma_data:
  uploads_data:
